name: secrets-scan

# AUT-990. This repo had NO CI of any kind — `git ls-tree -r origin/main | grep '^\.github/'`
# returned zero. Every other repo in the org gates pushes on gitleaks or detect-secrets; this was
# the only one with nothing underneath it, and it is the repo that publishes the privacy policy,
# the terms, and the /go/* ad-attribution routes.
#
# Nothing has ever leaked here — full history was scanned before this was added and came back
# clean — so this is prevention, not remediation.
#
# Copied from tessera-web/.github/workflows/secrets-scan.yml, deliberately including its pinned
# version + checksum, so the repos cannot silently drift onto different rule sets.
#
# Scans FULL HISTORY (fetch-depth: 0) — a key that was committed and later deleted is still
# leaked, and that is exactly the case a shallow scan misses.
#
# No .gitleaks.toml: the default ruleset reports zero findings on this repo's tree and full
# history (verified 2026-08-30). Adding an allowlist before there is anything to allow would only
# create a place for a future exemption to hide. If a legitimate public value ever trips a rule,
# add a config that pins that VALUE — never one that exempts a file path.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (official release checksums).
          # Same pinned version + checksum tessera-api and tessera-web use.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --redact
